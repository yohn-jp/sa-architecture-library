name: One-time import of historical IPA SA afternoon-I PDFs
on:
  push:
    branches: [feat/pm1-archive-2016-2022]
    paths:
      - .github/workflows/pm1-archive-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pm1-archive-2016-2022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor official PM1 PDFs and commit each year
        run: |
          python3 -m pip install --disable-pip-version-check -q 'PyMuPDF==1.26.5'
          python3 scripts/import_pm1_archive_once.py
      - name: Check Astro types and build entirely from local PDFs
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Verify all nine PM1 years and CBT browser journey
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify_pm1.mjs
