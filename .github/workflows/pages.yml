name: GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Cache original IPA AM2 question PDFs
        uses: actions/cache@v4
        with:
          path: .cache/ipa-am2
          key: sa-am2-ipa-originals-2026-10
      - name: Generate all 225 per-question images
        run: |
          python3 -m venv .venv-practice
          .venv-practice/bin/pip install --disable-pip-version-check -q 'PyMuPDF==1.26.5' 'Pillow==11.3.0' 'numpy==2.3.4'
          .venv-practice/bin/python scripts/generate_practice_assets.py
      - run: npm run check
      - run: npm run build
      - name: Verify reading pages and project paths
        run: python3 scripts/verify_site.py
      - name: Install browser for reading checks
        run: npx playwright install --with-deps chromium
      - name: Verify desktop, mobile and search
        run: npm run verify:reader
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Pages responses
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_live.py "$PAGE_URL"
