name: Import official PM1 PDFs (one-time)
on:
  push:
    branches: [feat/pm1-cbt]
    paths:
      - .github/workflows/pm1-vendor-once.yml
      - scripts/verify_pm1.mjs
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pm1-cbt
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch original IPA PDFs once and pin SHA-256
        run: |
          python3 -m pip install --disable-pip-version-check -q 'PyMuPDF==1.26.5'
          python3 scripts/fetch_pm1_pdfs.py
      - name: Commit original PDFs and their integrity manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/practice/pm1/pdfs/
          git diff --cached --quiet && { echo "No new PDFs"; exit 0; }
          git commit -m "assets: vendor original 2023-2025 SA afternoon I PDFs with SHA-256"
          git push origin HEAD:feat/pm1-cbt
      - name: Typecheck and build with committed assets in place
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Verify PC browser exercises against local PDF files
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify_pm1.mjs
