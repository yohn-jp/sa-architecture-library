name: One-time structured official PM1 answers
on:
  push:
    branches: [feat/pm1-official-structured-answers]
    paths:
      - .github/workflows/pm1-structure-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pm1-official-structured-answers
          persist-credentials: true
      - name: Convert official PDF table cells into structured answer fields
        run: |
          python3 scripts/pm1_structure_once.py
      - name: Check all question coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          years=json.loads(Path('src/data/pm1-sources.json').read_text())
          for y in years:
              data=json.loads((Path('src/data/pm1-structured')/(y['id']+'.json')).read_text())
              assert len(data['questions'])==y['questionCount']
              assert all(len(fields)>0 for fields in data['questions'].values())
          print('PASS: all official SA PM1 question answers structured for nine years')
          PY
