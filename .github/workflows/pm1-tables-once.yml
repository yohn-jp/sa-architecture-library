name: One-time PM1 official answer table inspection
on:
  push:
    branches: [feat/pm1-official-structured-answers]
    paths:
      - .github/workflows/pm1-tables-once.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pm1-official-structured-answers
          persist-credentials: true
      - name: Inspect original answer PDF table cells
        run: |
          python3 -m pip install -q 'PyMuPDF==1.26.5'
          python3 scripts/pm1_extract_tables_once.py
