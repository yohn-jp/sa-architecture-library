name: One-time verification of all IPA afternoon-I answers
on:
  push:
    branches: [feat/pm1-official-structured-answers]
    paths:
      - .github/workflows/pm1-verify-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pm1-official-structured-answers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare original AM2 crops for regression
        run: |
          python3 -m venv .venv-practice
          .venv-practice/bin/pip install -q 'PyMuPDF==1.26.5' 'Pillow==11.3.0' 'numpy==2.3.4'
          .venv-practice/bin/python scripts/generate_practice_assets.py
      - name: Astro typecheck
        run: npm run check
      - name: Build static site without source downloads
        run: npm run build
      - name: Verify all 18 original PDFs, 322 official-answer fields and internal links
        run: python3 scripts/verify_site.py
      - name: Install Chromium headless shell
        run: npx playwright install --only-shell chromium
      - name: Verify official answer comparison for all nine years in browser
        run: node scripts/verify_pm1.mjs
      - name: Verify existing reading and morning-II features
        run: |
          npm run verify:reader
          node scripts/verify_random.mjs
